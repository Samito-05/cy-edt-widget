name: android

on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write   # publication de l'APK sur un tag android-v*

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../EDT-CY.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EDT-CY-apk
          path: EDT-CY.apk
      # Release : sur un tag android-v*, ou automatiquement au premier push d'une
      # nouvelle versionName (tag android-v<versionName> créé par la CI s'il n'existe pas).
      - name: Version
        id: version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; exit 0
          fi
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/android-v$v" >/dev/null 2>&1; then
            echo "android-v$v existe déjà : pas de nouvelle release"
          else
            echo "tag=android-v$v" >> "$GITHUB_OUTPUT"
          fi
      - name: Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: EDT-CY.apk
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: EDT CY Android ${{ steps.version.outputs.tag }}
          body: |
            Application Android (widget emploi du temps CY). Télécharger **EDT-CY.apk** sur le téléphone, l'ouvrir et autoriser l'installation.
            Mise à jour : installer le nouvel APK par-dessus, les identifiants sont conservés.
