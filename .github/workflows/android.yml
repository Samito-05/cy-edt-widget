name: android

on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write   # publication de l'APK sur un tag android-v*

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../EDT-CY.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EDT-CY-apk
          path: EDT-CY.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: EDT-CY.apk
          name: EDT CY Android ${{ github.ref_name }}
          body: |
            Application Android (widget emploi du temps CY). Télécharger **EDT-CY.apk** sur le téléphone, l'ouvrir et autoriser l'installation.
            Mise à jour : installer le nouvel APK par-dessus, les identifiants sont conservés.
